{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}

<div class="container faq-page">
  <h1 class="faq-page__title">{{ page.heading }}</h1>
  <div class="faq-page__intro">{{ page.intro|richtext }}</div>

  <div class="row g-4 align-items-start">
    {% for col in columns %}
    <div class="col-lg-6">
      <div class="accordion faq-accordion" id="{{ col.id }}">
        {% for item in col.entries %}
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#faq{{ col.prefix }}{{ forloop.counter }}"
                    aria-expanded="false"
                    aria-controls="faq{{ col.prefix }}{{ forloop.counter }}">
              {{ item.value.question }}
            </button>
          </h2>
          <div id="faq{{ col.prefix }}{{ forloop.counter }}"
               class="accordion-collapse collapse"
               data-bs-parent="#{{ col.id }}">
            <div class="accordion-body">{{ item.value.answer|richtext }}</div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</div>

{% endblock %}
